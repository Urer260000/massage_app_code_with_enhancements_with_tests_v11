<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>the20sspa · iPhone Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Josefin+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --ink:#0E0D0B; --gold:#D4AF6A; --bright:#F0DCA6; --deep:#9C7C3E; --muted:#A39A88; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 18px; padding: 24px 16px; color: var(--muted);
    font-family: 'Josefin Sans', system-ui, sans-serif;
    background:
      repeating-conic-gradient(from 180deg at 50% 110%, rgba(212,175,106,.07) 0deg 2deg, transparent 2deg 9deg),
      var(--ink);
  }
  h1 { margin: 0; font-family: 'Limelight', serif; font-weight: 400; font-size: 34px; letter-spacing: 1px;
       background: linear-gradient(120deg, var(--deep), var(--bright) 55%, var(--gold));
       -webkit-background-clip: text; background-clip: text; color: transparent; }
  .bar { display: flex; gap: 10px; align-items: center; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; }
  select, button { font: inherit; letter-spacing: 1.5px; padding: 7px 14px; border-radius: 0;
                   background: transparent; color: var(--gold); border: 1px solid var(--gold); cursor: pointer; }
  select option { background: var(--ink); }
  .phone { position: relative; width: 421px; height: 880px; border-radius: 58px; padding: 14px;
           background: linear-gradient(145deg, #2a251b, #0b0a08);
           box-shadow: 0 0 0 1.5px var(--deep), 0 0 0 7px #15130f, 0 0 0 8px rgba(212,175,106,.35),
                       0 40px 90px rgba(0,0,0,.7), 0 0 120px rgba(212,175,106,.08); }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 45px; overflow: hidden; background: var(--ink); }
  .island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 122px; height: 36px;
            border-radius: 20px; background: #000; z-index: 2; pointer-events: none; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
  .note { font-size: 12px; letter-spacing: 1px; max-width: 420px; text-align: center; line-height: 1.5; }
</style>
</head>
<body>
  <h1>the20sspa</h1>
  <div class="bar">
    <select id="model" aria-label="iPhone model">
      <option value="393x852">iPhone 15 / 16</option>
      <option value="430x932">iPhone 15 / 16 Pro Max</option>
      <option value="375x667">iPhone SE</option>
    </select>
    <button onclick="document.getElementById('app').src = document.getElementById('app').src">Reload</button>
  </div>
  <div class="phone" id="phone">
    <div class="screen"><div class="island"></div>
      <iframe id="app" src="http://localhost:8080" title="the20sspa app"></iframe>
    </div>
  </div>
  <p class="note">Web build shown at iPhone size. Apple's iOS Simulator requires a Mac.</p>
<script>
  const model = document.getElementById('model');
  model.addEventListener('change', e => {
    const [w, h] = e.target.value.split('x').map(Number);
    const p = document.getElementById('phone');
    p.style.width = (w + 28) + 'px'; p.style.height = (h + 28) + 'px';
  });
  model.dispatchEvent(new Event('change'));
</script>
</body>
</html>
